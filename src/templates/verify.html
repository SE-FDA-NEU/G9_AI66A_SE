{% extends "base.html" %}
{% block title %}Verify your email{% endblock %}
{% block content %}
<div class="auth-stage">
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
      <div class="auth-header">
        <h1>Verify your email</h1>
      </div>

      {% if error %}
        <div class="flash error" role="alert" style="justify-content: center;">{{ error }}</div>
        <p style="margin: 20px 0 0;"><a class="button" href="/login" style="width: 100%;">Sign in</a></p>
      {% else %}
        <div class="flash success" role="status" style="justify-content: center;">Your email is verified. You can now book a venue.</div>
        <p style="margin: 20px 0 0;"><a class="button" href="{{ '/search' if g.user else '/login' }}" style="width: 100%;">{{ 'Find a venue' if g.user else 'Sign in' }}</a></p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Verify your email{% endblock %}
{% block content %}
<div class="auth-stage">
  <div class="auth-wrapper">
    <div class="auth-header">
      <h1>Verify your email</h1>
    </div>

    {% if error %}
      <div class="flash flash--error error" role="alert">{{ error }}</div>
      <p><a class="btn-primary btn-block" href="/login">Sign in</a></p>
    {% else %}
      <div class="flash flash--success success" role="status">Your email is verified. You can now book a venue.</div>
      <p><a class="btn-primary btn-block" href="{{ '/search' if g.user else '/login' }}">{{ 'Find a venue' if g.user else 'Sign in' }}</a></p>
    {% endif %}
  </div>
</div>
{% endblock %}

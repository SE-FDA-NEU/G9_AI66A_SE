{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-stage">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Sign in</h1>
      </div>

      {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}

      <form class="stack" method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <label>Email Address
          <input type="email" id="login-email" name="email" value="{{ email }}" autocomplete="email" placeholder="you@example.com" required autofocus>
        </label>
        <label>Password
          <input type="password" id="login-pw" name="password" autocomplete="current-password" placeholder="••••••••" required>
        </label>
        <div style="text-align: right; margin-top: -6px;">
          <a href="/forgot-password" style="font-size: 13px; font-weight: 600;">Forgot password?</a>
        </div>
        <button type="submit" style="width: 100%; padding: 12px; margin-top: 4px; font-size: 15px;">Sign in</button>
      </form>

      <p class="muted" style="text-align: center; margin-top: 20px; font-size: 14px;">
        Don't have an account? <a href="/register" style="font-weight: 700;">Register &rarr;</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block style %}
<style>
  .auth-wrapper {
    max-width: 440px;
    margin: 40px auto;
  }
  .auth-card {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 36px 32px;
    box-shadow: var(--shadow-lg);
  }
  .auth-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .auth-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #e3edda 0%, #d2e1c7 100%);
    border-radius: 16px;
    font-size: 24px;
    margin-bottom: 12px;
  }
  .auth-header h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 6px;
  }
  .auth-header p {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0;
  }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔐</div>
      <h1>Sign in to your account</h1>
      <p>Access your sports bookings and pitch schedule</p>
    </div>

    {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}

    <form class="stack" method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="hidden" name="next" value="{{ next }}">
      <label>Email Address
        <input type="email" id="login-email" name="email" value="{{ email }}" autocomplete="email" placeholder="you@example.com" required autofocus>
      </label>
      <label>Password
        <input type="password" id="login-pw" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <button type="submit" style="width: 100%; padding: 12px; margin-top: 8px; font-size: 15px;">Sign in</button>
    </form>

    <p class="muted" style="text-align: center; margin-top: 24px; font-size: 14px;">
      Don't have an account? <a href="/register" style="font-weight: 700;">Create account &rarr;</a>
    </p>
  </div>
</div>
{% endblock %}

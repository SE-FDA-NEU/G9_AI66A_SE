{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="auth-stage">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Change password</h1>
        <p>At least 8 characters, with a letter and a digit.</p>
      </div>

      {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}

      <form class="stack" method="post" action="/account/password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Current Password
          <input type="password" name="current_password" autocomplete="current-password" placeholder="••••••••" required autofocus>
        </label>
        <label>New Password
          <input type="password" name="new_password" autocomplete="new-password" placeholder="••••••••" minlength="8" required>
        </label>
        <label>Confirm New Password
          <input type="password" name="confirm_password" autocomplete="new-password" placeholder="••••••••" minlength="8" required>
        </label>
        <button type="submit" style="width: 100%; padding: 12px; margin-top: 4px; font-size: 15px;">Update password</button>
      </form>
      <p class="muted" style="text-align: center; margin-top: 20px; font-size: 14px;">
        <a href="{{ '/owner/venues' if g.user and g.user.role == 'owner' else ('/admin' if g.user and g.user.role == 'admin' else '/dashboard') }}" style="font-weight: 700;">&larr; Back</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

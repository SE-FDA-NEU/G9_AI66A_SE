{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="auth-stage">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Forgot password</h1>
        <p>Enter your account email to receive a reset link.</p>
      </div>

      <form class="stack" method="post" action="/forgot-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email Address
          <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required autofocus>
        </label>
        <button type="submit" style="width: 100%; padding: 12px; margin-top: 4px; font-size: 15px;">Send reset link</button>
      </form>

      <p class="muted" style="text-align: center; margin-top: 20px; font-size: 14px;">
        <a href="/login" style="font-weight: 700;">&larr; Back to sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
